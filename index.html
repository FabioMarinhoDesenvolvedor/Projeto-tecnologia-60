<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa de Bolos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="titulo">Casa de Bolos</h1>

    <div class="galeria">
        <figure class="produto">
            <img src="bolo sem cobertura" alt="Bolo sem cobertura">
            <figcaption>
                <span class="nome">Bolo sem cobertura</span>
                <span class="preco">R$ 45,00</span>
            </figcaption>
        </figure>

        <figure class="produto">
            <img src="bolo com cobertura" alt="Bolo com cobertura">
            <figcaption>
                <span class="nome">Bolo com cobertura</span>
                <span class="preco">R$ 55,00</span>
            </figcaption>
        </figure>

        <figure class="produto">
            <img src="bolo de pote" alt="Bolo de pote">
            <figcaption>
                <span class="nome">Bolo de pote</span>
                <span class="preco">R$ 8,00</span>
            </figcaption>
        </figure>
    </div>

</body>
</html>
